name: Public contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install
          jsonschema==4.25.1
          numpy==2.2.6
          Pillow==12.2.0
          pytest==8.4.2
      - run: python -m pytest -q
